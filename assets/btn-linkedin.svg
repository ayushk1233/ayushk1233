<svg xmlns="http://www.w3.org/2000/svg" width="180" height="36" viewBox="0 0 180 36" fill="none">
  <defs>
    <style>
      .btn-rect { fill: #FAF5EB; stroke: #C8BDB2; stroke-width: 1.2; rx: 3px; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 13px; font-weight: 600; fill: #281B24; letter-spacing: 0.2px; }
      .icon-plum { fill: #5E2245; }
      .arrow { font-family: sans-serif; font-size: 12px; fill: #826E7B; }
      .gold-bar { fill: #D79937; }
    </style>
  </defs>

  <!-- Minimal Rectangle -->
  <rect x="0.6" y="0.6" width="178.8" height="34.8" class="btn-rect" />
  <rect x="0.6" y="8" width="2.5" height="20" class="gold-bar" rx="1" />

  <!-- LinkedIn 'in' Icon -->
  <g transform="translate(42, 11)">
    <rect x="0" y="0" width="14" height="14" rx="2" class="icon-plum"/>
    <text x="7" y="10.5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#FAF5EB" text-anchor="middle">in</text>
  </g>

  <!-- Label -->
  <text x="64" y="23" class="text">LinkedIn</text>
  <text x="124" y="22" class="arrow">↗</text>
</svg>
