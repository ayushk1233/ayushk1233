<svg xmlns="http://www.w3.org/2000/svg" width="310" height="175" viewBox="0 0 310 175" fill="none">
  <defs>
    <style>
      .card-bg { fill: #FAF5EB; stroke: #D8CDC2; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Georgia", serif; font-size: 14.5px; font-weight: 700; fill: #281B24; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; line-height: 1.45; fill: #54464E; }
      .tag-bg { fill: #EDE3D8; rx: 10px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #4D2C42; text-anchor: middle; }
      .icon-plum { stroke: #6E2850; stroke-width: 2; stroke-linecap: round; }
      .arrow { fill: #7E6B77; font-family: sans-serif; font-size: 14px; font-weight: 400; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="308" height="173" class="card-bg" />

  <!-- Top-Right Arrow -->
  <text x="292" y="24" class="arrow" text-anchor="end">↗</text>

  <!-- Audio Waveform Icon in Deep Plum -->
  <g transform="translate(18, 16)">
    <line x1="2" y1="8" x2="2" y2="16" class="icon-plum" />
    <line x1="6" y1="4" x2="6" y2="20" class="icon-plum" />
    <line x1="10" y1="0" x2="10" y2="24" class="icon-plum" />
    <line x1="14" y1="6" x2="14" y2="18" class="icon-plum" />
    <line x1="18" y1="9" x2="18" y2="15" class="icon-plum" />
  </g>

  <!-- Title -->
  <text x="46" y="32" class="title">Indic Speech Dubbing Pipeline</text>

  <!-- Description -->
  <text x="18" y="60" class="desc">
    <tspan x="18" dy="0">End-to-end pipeline for high-quality, expressive</tspan>
    <tspan x="18" dy="16">dubbing of content into Indian languages using</tspan>
    <tspan x="18" dy="16">modern speech AI.</tspan>
  </text>

  <!-- Tags -->
  <g transform="translate(18, 126)">
    <!-- Tag 1: Speech AI -->
    <rect x="0" y="0" width="70" height="22" class="tag-bg" />
    <text x="35" y="15" class="tag-text">Speech AI</text>

    <!-- Tag 2: TTS -->
    <rect x="76" y="0" width="40" height="22" class="tag-bg" />
    <text x="96" y="15" class="tag-text">TTS</text>

    <!-- Tag 3: Voice Cloning -->
    <rect x="122" y="0" width="86" height="22" class="tag-bg" />
    <text x="165" y="15" class="tag-text">Voice Cloning</text>
  </g>
</svg>
