<svg xmlns="http://www.w3.org/2000/svg" width="310" height="175" viewBox="0 0 310 175" fill="none">
  <defs>
    <style>
      .card-bg { fill: #FDFBF7; stroke: #DCD4C5; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Georgia", serif; font-size: 14.5px; font-weight: 700; fill: #1C1917; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; line-height: 1.45; fill: #524E48; }
      .tag-bg { fill: #EFE8DC; rx: 10px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #5C5446; text-anchor: middle; }
      .icon-red-stroke { stroke: #B91C1C; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #78716C; font-family: sans-serif; font-size: 14px; font-weight: 400; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="308" height="173" class="card-bg" />

  <!-- Top-Right Arrow -->
  <text x="292" y="24" class="arrow" text-anchor="end">↗</text>

  <!-- Document Report Icon -->
  <g transform="translate(18, 16)">
    <path d="M3 2h9l5 5v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="none" class="icon-red-stroke" />
    <polyline points="12 2 12 7 17 7" fill="none" class="icon-red-stroke" />
    <line x1="5" y1="11" x2="13" y2="11" class="icon-red-stroke" />
    <line x1="5" y1="15" x2="13" y2="15" class="icon-red-stroke" />
  </g>

  <!-- Title -->
  <text x="44" y="32" class="title">DDR Report Generator</text>

  <!-- Description -->
  <text x="18" y="60" class="desc">
    <tspan x="18" dy="0">LLM-powered tool to generate structured,</tspan>
    <tspan x="18" dy="16">insightful defense/deal review (DDR) reports</tspan>
    <tspan x="18" dy="16">from unstructured inputs.</tspan>
  </text>

  <!-- Tags -->
  <g transform="translate(18, 126)">
    <!-- Tag 1: LLMs -->
    <rect x="0" y="0" width="48" height="22" class="tag-bg" />
    <text x="24" y="15" class="tag-text">LLMs</text>

    <!-- Tag 2: RAG -->
    <rect x="54" y="0" width="44" height="22" class="tag-bg" />
    <text x="76" y="15" class="tag-text">RAG</text>

    <!-- Tag 3: Report Generation -->
    <rect x="104" y="0" width="116" height="22" class="tag-bg" />
    <text x="162" y="15" class="tag-text">Report Generation</text>
  </g>
</svg>
