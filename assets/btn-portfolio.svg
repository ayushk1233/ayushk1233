<svg xmlns="http://www.w3.org/2000/svg" width="220" height="38" viewBox="0 0 220 38" fill="none">
  <defs>
    <style>
      .btn-bg { fill: #FAF4E8; stroke: #D8CDC2; stroke-width: 1.5; rx: 8px; }
      .accent { stroke: #D79937; stroke-width: 2.5; stroke-linecap: round; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 600; fill: #281B24; }
      .icon { stroke: #5E2245; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { font-family: sans-serif; font-size: 13px; fill: #7E6B77; }
    </style>
  </defs>

  <!-- Button Base -->
  <rect x="1" y="1" width="218" height="36" class="btn-bg" />
  
  <!-- Left Accent Line: Warm Gold -->
  <line x1="1" y1="10" x2="1" y2="28" class="accent" />

  <!-- Link Icon: Deep Plum -->
  <g transform="translate(62, 11)">
    <path d="M7 4a3 3 0 0 1 4.2 0l1.4 1.4a3 3 0 0 1 0 4.2l-2.8 2.8a3 3 0 0 1-4.2 0" class="icon" />
    <path d="M9 12a3 3 0 0 1-4.2 0L3.4 10.6a3 3 0 0 1 0-4.2l2.8-2.8a3 3 0 0 1 4.2 0" class="icon" />
  </g>

  <!-- Label -->
  <text x="86" y="24" class="text">Portfolio</text>
  <text x="148" y="23" class="arrow">↗</text>
</svg>
