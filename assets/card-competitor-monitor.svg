<svg xmlns="http://www.w3.org/2000/svg" width="310" height="175" viewBox="0 0 310 175" fill="none">
  <defs>
    <style>
      .card-bg { fill: #FAF5EB; stroke: #D8CDC2; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Georgia", serif; font-size: 14.5px; font-weight: 700; fill: #281B24; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; line-height: 1.45; fill: #54464E; }
      .tag-bg { fill: #EDE3D8; rx: 10px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #4D2C42; text-anchor: middle; }
      .icon-plum-fill { fill: #6E2850; }
      .arrow { fill: #7E6B77; font-family: sans-serif; font-size: 14px; font-weight: 400; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="308" height="173" class="card-bg" />

  <!-- Top-Right Arrow -->
  <text x="292" y="24" class="arrow" text-anchor="end">↗</text>

  <!-- Bar Chart Icon in Deep Plum -->
  <g transform="translate(18, 16)">
    <rect x="2" y="12" width="3.5" height="10" rx="1" class="icon-plum-fill" />
    <rect x="7.5" y="6" width="3.5" height="16" rx="1" class="icon-plum-fill" />
    <rect x="13" y="1" width="3.5" height="21" rx="1" class="icon-plum-fill" />
  </g>

  <!-- Title -->
  <text x="44" y="32" class="title">Competitor Intelligence Monitor</text>

  <!-- Description -->
  <text x="18" y="60" class="desc">
    <tspan x="18" dy="0">Automated system to track competitors, analyze</tspan>
    <tspan x="18" dy="16">product and market signals, and deliver actionable</tspan>
    <tspan x="18" dy="16">intelligence.</tspan>
  </text>

  <!-- Tags -->
  <g transform="translate(18, 126)">
    <!-- Tag 1: LLM Agents -->
    <rect x="0" y="0" width="76" height="22" class="tag-bg" />
    <text x="38" y="15" class="tag-text">LLM Agents</text>

    <!-- Tag 2: Web Data -->
    <rect x="82" y="0" width="66" height="22" class="tag-bg" />
    <text x="115" y="15" class="tag-text">Web Data</text>

    <!-- Tag 3: Analytics -->
    <rect x="154" y="0" width="60" height="22" class="tag-bg" />
    <text x="184" y="15" class="tag-text">Analytics</text>
  </g>
</svg>
