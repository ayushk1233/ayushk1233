<svg xmlns="http://www.w3.org/2000/svg" width="800" height="36" viewBox="0 0 800 36" fill="none">
  <defs>
    <style>
      .rule { stroke: #6E2850; stroke-width: 1.2; opacity: 0.85; }
      .text { font-family: "Georgia", "Times New Roman", serif; font-size: 15px; font-style: italic; fill: #281B24; text-anchor: middle; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Left rule in Plum -->
  <line x1="20" y1="18" x2="310" y2="18" class="rule" />
  
  <!-- Motto -->
  <text x="400" y="23" class="text">Build. Learn. Repeat.</text>
  
  <!-- Right rule in Plum -->
  <line x1="490" y1="18" x2="780" y2="18" class="rule" />
</svg>
